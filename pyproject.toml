[project]
name = "ar-judicial"
version = "0.1.0"
description = "Clientes y parsers para sistemas judiciales argentinos (MEV/SCBA, PJN, Portal de Notificaciones), pensados para usarse desde skills de Claude."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ar-judicial = "ar_judicial.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_judicial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
